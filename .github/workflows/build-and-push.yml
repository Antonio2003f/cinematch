name: Build and Push to GHCR

on:
  push:
    branches: [main]

# Permite workflow-ului sa scrie in GitHub Container Registry
# folosind tokenul automat GITHUB_TOKEN, fara secrete suplimentare.
permissions:
  contents: read
  packages: write

jobs:
  build-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout cod
        uses: actions/checkout@v4

      # QEMU permite emularea altor arhitecturi CPU (aici: ARM64)
      # pe runner-ul GitHub, care e nativ x86_64.
      - name: Configurare QEMU (emulare cross-platform)
        uses: docker/setup-qemu-action@v3

      # Buildx e motorul de build extins al Docker, necesar pentru
      # a construi imagini pentru alta arhitectura decat cea a runner-ului.
      - name: Configurare Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Autentificare la GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tag-urile Docker trebuie sa fie complet lowercase, dar
      # github.repository_owner pastreaza majusculele reale ale contului
      # (ex. "Antonio2003f") - il convertim explicit inainte de folosire.
      - name: Normalizare nume owner (lowercase)
        run: echo "OWNER_LC=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - name: Build si push imagine backend (arm64)
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          platforms: linux/arm64
          push: true
          tags: ghcr.io/${{ env.OWNER_LC }}/cinematch-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout cod
        uses: actions/checkout@v4

      - name: Configurare QEMU (emulare cross-platform)
        uses: docker/setup-qemu-action@v3

      - name: Configurare Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Autentificare la GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Normalizare nume owner (lowercase)
        run: echo "OWNER_LC=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - name: Build si push imagine frontend (arm64)
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          platforms: linux/arm64
          push: true
          tags: ghcr.io/${{ env.OWNER_LC }}/cinematch-frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
