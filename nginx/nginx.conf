events {
    worker_connections 1024;
}

http {
    # Rezolvare DNS interna Docker - upstream-urile pot porni dupa Nginx,
    # asa ca folosim resolver + variabile ca sa nu pice la boot daca
    # backend/frontend nu sunt inca sus (retry la fiecare request, nu la start).
    resolver 127.0.0.11 valid=10s;

    client_max_body_size 5m;

    server {
        listen 80;

        # Tot ce incepe cu /api merge catre backend-ul FastAPI.
        # Rescriem /api/search -> /search inainte sa trimitem mai departe.
        location /api/ {
            set $backend_upstream http://backend:8000;
            rewrite ^/api/(.*)$ /$1 break;
            proxy_pass $backend_upstream;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 5s;
            proxy_read_timeout 30s;
        }

        # Tot restul (/, /favicon.ico etc.) merge catre Next.js.
        location / {
            set $frontend_upstream http://frontend:3000;
            proxy_pass $frontend_upstream;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Necesar pentru Next.js dev/hot-reload si pentru unele
            # raspunsuri streamed; inofensiv in productie.
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
}
