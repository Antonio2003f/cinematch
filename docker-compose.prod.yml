# Folosit doar pe VM-ul de productie, combinat cu docker-compose.yml:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# Suprascrie doar 'image' pentru backend/frontend, ca sa traga imaginile
# deja construite de pe GHCR, in loc sa reconstruiasca local (lent, consuma
# resursele modeste ale VM-ului). Restul serviciilor (postgres, redis,
# qdrant, nginx) raman neschimbate, mostenite din docker-compose.yml.

services:
  backend:
    build: !reset null
    image: ghcr.io/antonio2003f/cinematch-backend:latest

  frontend:
    build: !reset null
    image: ghcr.io/antonio2003f/cinematch-frontend:latest
